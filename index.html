<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wisdom 復習帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Serif+JP:wght@400;500;600&family=EB+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F8F3E6;
    --paper-edge:#EFE7D2;
    --card:#FFFEF9;
    --ink:#242A3B;
    --ink-soft:#4A4C56;
    --sub:#7A7362;
    --ribbon:#9E2B2B;
    --ribbon-dark:#7C1F1F;
    --gold:#AD8A45;
    --gold-soft:#D8C79A;
    --good:#4B6B43;
    --good-bg:#E7EEDF;
    --bad:#9E2B2B;
    --bad-bg:#F5E6E2;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  .app{
    font-family:'Noto Serif JP','EB Garamond',serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    padding:32px 16px 56px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .masthead{
    width:100%;
    max-width:560px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:18px;
    padding-bottom:10px;
    border-bottom:1px solid var(--gold-soft);
  }
  .masthead h1{
    font-family:'Shippori Mincho',serif;
    font-weight:700;
    font-size:20px;
    margin:0;
    letter-spacing:.04em;
    color:var(--ink);
  }
  .masthead .count{
    font-family:'EB Garamond',serif;
    font-size:14px;
    color:var(--sub);
    font-style:italic;
  }
  .stats-row{
    width:100%;
    max-width:560px;
    display:flex;
    gap:10px;
    margin-bottom:20px;
  }
  .stat{
    flex:1;
    background:var(--card);
    border:1px solid var(--paper-edge);
    border-radius:2px;
    padding:10px 14px;
    text-align:center;
  }
  .stat .n{
    font-family:'EB Garamond',serif;
    font-size:22px;
    font-weight:500;
    color:var(--ink);
    display:block;
    line-height:1.2;
  }
  .stat .l{
    font-size:11px;
    color:var(--sub);
    letter-spacing:.03em;
  }
  .stage{
    width:100%;
    max-width:560px;
    position:relative;
  }
  .card{
    position:relative;
    background:var(--card);
    border:1px solid var(--paper-edge);
    border-radius:3px;
    box-shadow:0 1px 0 var(--paper-edge), 0 10px 24px -18px rgba(36,42,59,0.35);
    padding:46px 34px 30px;
    min-height:280px;
    display:flex;
    flex-direction:column;
  }
  .ribbon{
    position:absolute;
    top:-4px;
    right:28px;
    width:20px;
    height:52px;
    background:var(--ribbon);
    clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);
  }
  .guide{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:var(--gold);
    letter-spacing:.08em;
    border-bottom:1px solid var(--gold-soft);
    padding-bottom:8px;
    margin-bottom:20px;
  }
  .prompt-wrap{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:10px 0 18px;
  }
  .prompt{
    font-family:'EB Garamond',serif;
    font-style:italic;
    font-weight:500;
    color:var(--ink);
    line-height:1.35;
  }
  .prompt.sz-lg{font-size:36px;}
  .prompt.sz-md{font-size:26px;}
  .prompt.sz-sm{font-size:19px;}
  .divider{
    border:none;
    border-top:1px dashed var(--gold-soft);
    margin:0 0 18px;
  }
  .answer{
    display:none;
  }
  .answer.shown{display:block;}
  .answer ol{
    margin:0;
    padding-left:20px;
    color:var(--ink-soft);
    font-size:15px;
    line-height:1.75;
  }
  .answer li{margin-bottom:6px;}
  .answer li::marker{color:var(--gold); font-family:'EB Garamond',serif;}
  .reveal-btn{
    display:block;
    width:100%;
    margin-top:auto;
    background:transparent;
    border:1px solid var(--ink);
    color:var(--ink);
    font-family:'Noto Serif JP',serif;
    font-size:14px;
    letter-spacing:.05em;
    padding:11px;
    border-radius:2px;
    cursor:pointer;
  }
  .reveal-btn:hover{background:var(--ink); color:var(--card);}
  .grade-row{
    display:none;
    gap:10px;
    margin-top:18px;
  }
  .grade-row.shown{display:flex;}
  .grade-btn{
    flex:1;
    font-family:'Noto Serif JP',serif;
    font-size:14px;
    letter-spacing:.03em;
    padding:12px 8px;
    border-radius:2px;
    cursor:pointer;
    border:1px solid var(--paper-edge);
    background:var(--card);
    color:var(--ink);
  }
  .grade-btn .sub{display:block; font-size:11px; color:var(--sub); margin-top:2px;}
  .grade-btn.bad:hover{background:var(--bad-bg); border-color:var(--bad); color:var(--bad);}
  .grade-btn.good:hover{background:var(--good-bg); border-color:var(--good); color:var(--good);}
  .footer-row{
    width:100%;
    max-width:560px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:16px;
    font-size:12px;
    color:var(--sub);
  }
  .footer-row button{
    background:none;
    border:none;
    color:var(--sub);
    font-size:12px;
    text-decoration:underline;
    cursor:pointer;
    padding:4px;
    font-family:'Noto Serif JP',serif;
  }
  .done{
    text-align:center;
    padding:60px 20px;
    color:var(--sub);
  }
  .done h2{
    font-family:'Shippori Mincho',serif;
    color:var(--ink);
    font-size:20px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#20232B;
      --paper-edge:#333748;
      --card:#282C38;
      --ink:#EDE9DD;
      --ink-soft:#C9C4B5;
      --sub:#8C8778;
      --gold:#C9A961;
      --gold-soft:#4A4636;
      --good:#8FBF7F;
      --good-bg:#2C3826;
      --bad:#E28080;
      --bad-bg:#3A2626;
    }
  }
</style>
</head>
<body>
<div class="app">
  <div class="masthead">
    <h1>Wisdom 復習帳</h1>
    <span class="count" id="deck-count"></span>
  </div>
  <div class="stats-row">
    <div class="stat"><span class="n" id="stat-new">0</span><span class="l">未習</span></div>
    <div class="stat"><span class="n" id="stat-learning">0</span><span class="l">学習中</span></div>
    <div class="stat"><span class="n" id="stat-mastered">0</span><span class="l">習得</span></div>
    <div class="stat"><span class="n" id="stat-today">0</span><span class="l">今日</span></div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="footer-row">
    <span id="deck-progress"></span>
    <button id="reset-btn" type="button">進捗をリセット</button>
  </div>
</div>

, (ほぼ)垂直の", "[形] 4. <ナイロン･絹などが>非常に薄い, 透けて見える.", "[副] 1. (ほぼ)垂直に", "[副] 2. まったく; まともに.", "[名] [Ｕ] 透けるような薄い織物; [Ｃ] その服."]}, {"word": "wrinkle(1)", "defs": ["[名] [Ｃ] 1. (顔の)しわ", "[名] [Ｃ] 2. (布･紙などの)しわ, ひだ", "ちょっとした欠点をなくす.", "[動] [他] <人が><皮膚･衣類など>にしわを作る; <眉など>にしわを寄せる(up)", "[動] [自] <皮膚･衣類などが>しわが寄る, しわになる(up)"]}, {"word": "contempt", "defs": ["[名] [Ｕ] 1. «人･事･物に対する»軽蔑, 侮蔑, さげすみ«for»; 軽蔑されること, 屈辱(感)", "[名] [Ｕ] 2. «規則･危険などに対する»軽視, 無視«for»", "[名] [Ｕ] 3. 〘法〙(法廷命令の無視による)法廷侮辱罪(contempt of court)([注]名誉毀損における「侮辱」はinsult)"]}, {"word": "species", "defs": ["[名] [Ｃ] 1. 〘生物〙種(しゆ)(→ classification 2. )(動植物分類上の単位; 生殖可能な範囲の集合)", "[名] [Ｃ] 2. [the/our ～]人類(humankind)", "[名] [Ｃ] 3. (くだけて)種類, 一種.", "[名] [Ｃ] 4. [種類では[Ｃ] ]〘論〙種, 種概念(類概念を構成する1つの種としての概念; → genus).", "[名] [Ｃ] 5. 〘カトリック〙ミサ用のパンとブドウ酒; その外形[観].", "[名] [Ｃ] 6. [種類では[Ｃ] ]〘法〙形式, 体裁.", "[単数形で]種間障壁(伝染病などの動植物の種を越えた感染を防ぐ自然の機能)."]}, {"word": "immense", "defs": ["[形] <場所･物などが>(計り知れないほど)広大な, 巨大な; <程度･量などが>膨大な, 計り知れない(enormous); (くだけて)すばらしい, すごい"]}, {"word": "hýpocènter", "defs": ["[名] [Ｃ] [通例the ～]震源(地); (核兵器の)爆心(地点)."]}];

<script>
(function(){
  const STORAGE_KEY = 'wisdom-review-progress';
  const stage = document.getElementById('stage');
  const els = {
    deckCount: document.getElementById('deck-count'),
    deckProgress: document.getElementById('deck-progress'),
    statNew: document.getElementById('stat-new'),
    statLearning: document.getElementById('stat-learning'),
    statMastered: document.getElementById('stat-mastered'),
    statToday: document.getElementById('stat-today'),
    resetBtn: document.getElementById('reset-btn'),
  };
  els.deckCount.textContent = ENTRIES.length + ' 語';

  const todayStr = new Date().toISOString().slice(0,10);
  let progress = { boxes:{}, todayCount:0, todayDate: todayStr, seenCount:0 };
  let currentIndex = -1;
  let revealed = false;

  function boxOf(word){
    return progress.boxes[word] || 0;
  }

  function weightFor(word){
    const b = boxOf(word);
    if(b===0) return 6;
    if(b===1) return 4;
    if(b===2) return 2.2;
    if(b===3) return 1.1;
    if(b===4) return 0.5;
    return 0.15;
  }

  function pickIndex(){
    const weights = ENTRIES.map((e,i)=> i===currentIndex ? 0 : weightFor(e.word));
    const total = weights.reduce((a,b)=>a+b,0);
    if(total<=0) return Math.floor(Math.random()*ENTRIES.length);
    let r = Math.random()*total;
    for(let i=0;i<weights.length;i++){
      r -= weights[i];
      if(r<=0) return i;
    }
    return weights.length-1;
  }

  function sizeClassFor(word){
    if(word.length<=18) return 'sz-lg';
    if(word.length<=40) return 'sz-md';
    return 'sz-sm';
  }

  function updateStats(){
    let n=0,l=0,m=0;
    ENTRIES.forEach(e=>{
      const b = boxOf(e.word);
      if(b===0) n++;
      else if(b>=4) m++;
      else l++;
    });
    els.statNew.textContent = n;
    els.statLearning.textContent = l;
    els.statMastered.textContent = m;
    els.statToday.textContent = progress.todayDate===todayStr ? progress.todayCount : 0;
    els.deckProgress.textContent = '累計 ' + progress.seenCount + ' 回復習';
  }

  function renderCard(){
    const entry = ENTRIES[currentIndex];
    revealed = false;
    const sz = sizeClassFor(entry.word);
    stage.innerHTML = ''
      + '<div class="card">'
      + '  <div class="ribbon"></div>'
      + '  <div class="guide"><span>HEADWORD</span><span>' + (currentIndex+1) + ' / ' + ENTRIES.length + '</span></div>'
      + '  <div class="prompt-wrap"><div class="prompt ' + sz + '" id="prompt-text"></div></div>'
      + '  <hr class="divider">'
      + '  <div class="answer" id="answer-block"><ol id="answer-list"></ol></div>'
      + '  <button class="reveal-btn" id="reveal-btn" type="button">意味を確認する</button>'
      + '  <div class="grade-row" id="grade-row">'
      + '    <button class="grade-btn bad" id="grade-bad" type="button">わからなかった<span class="sub">また近いうちに</span></button>'
      + '    <button class="grade-btn good" id="grade-good" type="button">わかった<span class="sub">出題間隔をのばす</span></button>'
      + '  </div>'
      + '</div>';
    document.getElementById('prompt-text').textContent = entry.word;
    const list = document.getElementById('answer-list');
    entry.defs.forEach(d=>{
      const li = document.createElement('li');
      li.textContent = d;
      list.appendChild(li);
    });
    document.getElementById('reveal-btn').addEventListener('click', reveal);
    document.getElementById('grade-bad').addEventListener('click', ()=>grade(false));
    document.getElementById('grade-good').addEventListener('click', ()=>grade(true));
  }

  function reveal(){
    revealed = true;
    document.getElementById('answer-block').classList.add('shown');
    document.getElementById('reveal-btn').style.display = 'none';
    document.getElementById('grade-row').classList.add('shown');
  }

  function grade(good){
    const entry = ENTRIES[currentIndex];
    const b = boxOf(entry.word);
    progress.boxes[entry.word] = good ? Math.min(b+1,5) : 1;
    if(progress.todayDate !== todayStr){
      progress.todayDate = todayStr;
      progress.todayCount = 0;
    }
    progress.todayCount += 1;
    progress.seenCount += 1;
    saveProgress();
    updateStats();
    nextCard();
  }

  function nextCard(){
    currentIndex = pickIndex();
    renderCard();
  }

  async function loadProgress(){
    try{
      const res = await window.storage.get(STORAGE_KEY);
      if(res && res.value){
        const parsed = JSON.parse(res.value);
        progress = Object.assign(progress, parsed);
        if(progress.todayDate !== todayStr){
          progress.todayDate = todayStr;
          progress.todayCount = 0;
        }
      }
    }catch(e){
      // no saved progress yet
    }
  }

  async function saveProgress(){
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(progress));
    }catch(e){
      // ignore storage errors, keep session state
    }
  }

  els.resetBtn.addEventListener('click', async ()=>{
    if(!confirm('進捗をすべてリセットしますか？')) return;
    progress = { boxes:{}, todayCount:0, todayDate: todayStr, seenCount:0 };
    await saveProgress();
    updateStats();
    nextCard();
  });

  (async function init(){
    await loadProgress();
    updateStats();
    nextCard();
  })();
})();
</script>
